name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    environment: CURSEFORGE_API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Larper-Than-Wolves-jars
          path: build/libs/*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Larper Than Wolves ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: build/libs/*.jar
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to CurseForge & Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          curseforge-id: 1675627
          curseforge-token: ${{ secrets.CURSEFORGE_API }}
          modrinth-id: rnq9KWpr
          modrinth-token: ${{ secrets.MODRINTH_API }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: "Larper Than Wolves ${{ github.ref_name }}"
          version: ${{ github.ref_name }}
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retry-attempts: 3
          retry-delay: 5000
